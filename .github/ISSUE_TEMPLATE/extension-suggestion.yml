name: Suggest an extension
description: Propose a public Aseprite extension for the bundled catalog.
title: "[Catalog] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an extension. Inclusion is reviewed manually and is not guaranteed.

  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Link to the public GitHub repository.
      placeholder: https://github.com/owner/extension
    validations:
      required: true

  - type: input
    id: manifest
    attributes:
      label: Manifest name and version
      description: The exact `name` and stable `MAJOR.MINOR.PATCH` version from package.json.
      placeholder: example-extension 1.2.3
    validations:
      required: true

  - type: input
    id: release
    attributes:
      label: Stable release or tag
      description: Link to the preferred `.aseprite-extension` release asset or immutable tag.
      placeholder: https://github.com/owner/extension/releases/tag/v1.2.3
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: License
      description: SPDX license identifier and link to the repository license.
      placeholder: MIT — https://github.com/owner/extension/blob/main/LICENSE
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Aseprite compatibility
      description: Versions tested, required API features, and the operating systems tested.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why should it be included?
      description: Explain what the extension does and why it is useful and trustworthy.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: The repository is public and has one Aseprite package.json at its root.
          required: true
        - label: The submitted version is stable and uses MAJOR.MINOR.PATCH.
          required: true
        - label: The package does not contain native executables or libraries.
          required: true
        - label: I understand that catalog inclusion requires maintainer review and is not automatic.
          required: true
